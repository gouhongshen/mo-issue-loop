name: Build Challenger image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Build and publish immutable toolchain image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY/base:$GITHUB_SHA"
          docker build -t "$image" .
          docker run --rm "$image" go version
          docker run --rm "$image" bzip2 --help
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          docker push "$image"
          docker inspect --format '{{index .RepoDigests 0}}' "$image" > image.txt
          docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-digest
          path: image.txt
          retention-days: 7
